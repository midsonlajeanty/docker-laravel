name: CI

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "docker/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Lint workflows (actionlint)
        uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1.72.0

      - name: Lint shell scripts (shellcheck)
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: error

  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build production image (amd64, load)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: production
          load: true
          tags: laravel:smoke
          build-args: |
            SERVERSIDEUP_PHP_VERSION=8.5-fpm-nginx-alpine
          cache-from: type=gha,scope=8.5-production

      - name: Boot and verify the web stack
        run: |
          set -eu
          cid="$(docker run -d laravel:smoke)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sleep 15
          if [ -z "$(docker ps -q --filter id="$cid" --filter status=running)" ]; then
            echo "::error::container exited unexpectedly"
            docker logs "$cid"
            exit 1
          fi
          docker top "$cid" | grep -q nginx    || { echo "::error::nginx is not running";   docker logs "$cid"; exit 1; }
          docker top "$cid" | grep -q php-fpm  || { echo "::error::php-fpm is not running"; docker logs "$cid"; exit 1; }

  build:
    needs: [lint, smoke]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        target: ["production", "development"]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build (validation, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: |
            SERVERSIDEUP_PHP_VERSION=${{ matrix.php }}-fpm-nginx-alpine
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.php }}-${{ matrix.target }}
